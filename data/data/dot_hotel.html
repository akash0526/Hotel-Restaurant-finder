<script >

    $(document).ready(function () {
        Vue.component('v-page-form-com', function (resolve, reject) {
                $.get(htmlAuthLoginUrl.form).then(function (res) {
                    resolve({
                        template: res, props: ['page']
                    })
                });
            });
            vPage = new Vue({
                el: '#app',
                i18n,
                store,
        created() {
                this.$store.commit('changeLang', localStorage.getItem("lang") || 'np')
            },
                data: {
                    page: new loginModel()
                }
            });
        
    });
    function login() {
            vPage.page.loading = true;
        if (isEmptyOrSpaces(vPage.page.mData.userName) || isEmptyOrSpaces(vPage.page.mData.password)) {
            vPage.page.msg = new messageModel('Warning', 'Fill all the required fields.');
            vPage.page.viewMsg = true;
                vPage.page.loading = false;
            return;
        }
        var request = postRequest(apiAuthLoginUrl.login, vPage.page.mData)
        request.done(function (response) {
            vPage.page.viewMsg = true;
                vPage.page.loading = false;
            vPage.page.msg = response.msg;
            if (response.msg.status) {
             
                var tokenCooki = "pgwToken=Bearer " + response.data.jwtToken + "; expires=" + response.data.tokenExpiry + "; path=/;";
                document.cookie = tokenCooki;
                //document.cookie="lang=en"
                if(response.data.userTypeId==2)
                {
                window.location = "/dot/#company/dashboard";
                }
                else if(response.data.userTypeId==1)
                {
                window.location = "/dot/#admin/dashboard";
                }
                else{
                window.location = "/dot/#dashboard";
                }
                //document.cookie="lang=en"
            }
        });
    }
     function forgotpassword() {     
              window.location = "/home/forgotpassword/";
    }
      function changepassword() {
      window.location = "/home/changepassword/";
        
    }
      function newregister() {
      window.location = "/home/registration/";
        
    }
 

</script>

         function checkSubmit(e) {
           if(e && e.keyCode == 13) {
               login()
           }
